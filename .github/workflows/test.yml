name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm ci requires the lock file to exactly match the local machine's npm-version-specific
      # resolution, which was flaky across npm 10 (CI) vs 11 (local) for this dependency tree —
      # npm install resolves fresh each run instead of demanding bit-exact lock conformance.
      - run: npm install

      - run: npx jest --runInBand

      # Catches shared-file drift (constants.tolk, common.tolk, stdlib) silently shifting a
      # contract's compiled bytecode -- and therefore its deploy address -- the moment it
      # happens, not whenever someone next happens to recompute an address by hand. See
      # pinned-hashes.json's header for the incident that motivated this.
      - run: npx tsx scripts/checkPinnedHashes.ts
