name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # npm ci requires the lock file to exactly match the local machine's npm-version-specific
      # resolution, which was flaky across npm 10 (CI) vs 11 (local) for this dependency tree —
      # npm install resolves fresh each run instead of demanding bit-exact lock conformance.
      - run: npm install

      - run: npx jest --runInBand
